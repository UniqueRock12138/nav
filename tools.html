<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具箱 - 个人工具导航</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="tools">
  <header class="app-header">
    <div class="app-header__inner">
      <a class="brand" href="index.html">
        <span class="brand__title">个人工具导航</span>
        <span class="brand__subtitle">Tools & Navigation</span>
      </a>
      <nav class="top-nav" aria-label="主导航">
        <a class="top-nav__link" href="index.html" data-nav-link>首页</a>
        <a class="top-nav__link" href="tools.html" data-nav-link>工具箱</a>
        <a class="top-nav__link" href="nav.html" data-nav-link>网页导航</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="page-hero page-hero--compact">
      <p class="page-kicker">Toolbox</p>
      <h1 class="page-title">工具箱</h1>
      <p class="page-description">维护常用命令和 LLM 提示词。重点是查找快、复制快、后续新增数据方便。</p>
      <div class="search-box">
        <label class="sr-only" for="page-search">搜索命令或提示词</label>
        <input class="search-box__input" id="page-search" type="search" placeholder="搜索命令、说明或提示词内容">
      </div>
    </section>

    <div class="tool-layout">
      <aside class="sidebar" aria-label="工具箱分组">
        <div class="sidebar__group">
          <p class="sidebar__title">LLM 提示词库</p>
          <a class="sidebar__link" href="#prompt-engineering" data-sidebar-link>工程构建</a>
          <a class="sidebar__link" href="#prompt-visual" data-sidebar-link>视觉生成</a>
          <a class="sidebar__link" href="#prompt-emotional" data-sidebar-link>情感对话</a>
        </div>
        <div class="sidebar__group">
          <p class="sidebar__title">常用命令</p>
          <a class="sidebar__link" href="#command-linux" data-sidebar-link>Linux 命令</a>
          <a class="sidebar__link" href="#command-powershell" data-sidebar-link>PowerShell 命令</a>
          <a class="sidebar__link" href="#command-ai-cli" data-sidebar-link>AI CLI 命令</a>
        </div>
      </aside>

      <div class="content-stack">
        <section class="section" id="prompts" hidden>
          <div class="section-header">
            <div>
              <h2 class="section-header__title">LLM 提示词库</h2>
              <p class="section-header__desc">展开条目查看原文，复制按钮只复制对应提示词内容。</p>
            </div>
          </div>
          <div id="prompts-root"></div>
        </section>

        <section class="section" id="commands" hidden>
          <div class="section-header">
            <div>
              <h2 class="section-header__title">常用命令</h2>
              <p class="section-header__desc">按 Linux、PowerShell、Claude Code / Codex CLI 分组。</p>
            </div>
          </div>
          <div id="commands-root"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/copy.js"></script>
  <script src="data/commands.js"></script>
  <script src="prompts/engineering/general.js"></script>
  <script src="prompts/engineering/project-impl.js"></script>
  <script src="prompts/engineering/docs.js"></script>
  <script src="prompts/engineering/tech-teaching.js"></script>
  <script src="prompts/visual/image-gen.js"></script>
  <script src="prompts/emotional/expression.js"></script>
  <script src="prompts/emotional/thought-dialogue.js"></script>
  <script src="data/promptsIndex.js"></script>
  <script src="js/renderCommands.js"></script>
  <script src="js/renderPrompts.js"></script>
</body>
</html>
